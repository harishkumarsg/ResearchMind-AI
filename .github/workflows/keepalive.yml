name: keepalive

# Free-tier Supabase pauses a project after a week of low database activity,
# and free-tier Qdrant Cloud suspends a cluster after a week unused (then
# deletes it). This workflow makes one real database query and one real
# Qdrant request about every two days. If either service is paused, suspended
# or unreachable, the run fails and GitHub emails the repository owner, so it
# doubles as a simple uptime alert.
#
# Scheduled workflows only run from the default branch, and GitHub disables
# them after 60 days without repository activity (re-enable on the Actions tab).
#
# The repository is public, so its Actions logs are public too. Neither step
# prints provider output or error text, which can contain the database host or
# the cluster URL; failures report only which check failed and its exit code.

on:
  schedule:
    # About every two days at 06:17 UTC; the uneven minute avoids the
    # top-of-hour scheduling queue.
    - cron: "17 6 */2 * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query the database (Supabase)
        env:
          # Connection string for the researchmind_keepalive role
          # (backend/migrations/bootstrap/keepalive_role.sql), via the pooler.
          KEEPALIVE_DATABASE_URL: ${{ secrets.KEEPALIVE_DATABASE_URL }}
        run: |
          if [ -z "$KEEPALIVE_DATABASE_URL" ]; then
            echo "::error::Secret KEEPALIVE_DATABASE_URL is not set."
            exit 1
          fi
          # Under forced RLS this role sees no rows, so the count is 0,
          # but the query still runs against the database.
          set +e
          psql "$KEEPALIVE_DATABASE_URL" -X -q -t -A -v ON_ERROR_STOP=1 \
            -c "select count(*) from public.papers" > /dev/null 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "::error::Database query failed (psql exit $status). Check whether the Supabase project is paused."
            exit 1
          fi
          echo "Database query OK."

      - name: Request the Qdrant collection
        # Runs even if the database step failed, so both services are pinged.
        if: ${{ !cancelled() }}
        env:
          QDRANT_URL: ${{ secrets.QDRANT_URL }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
        run: |
          if [ -z "$QDRANT_URL" ] || [ -z "$QDRANT_API_KEY" ]; then
            echo "::error::Secrets QDRANT_URL and QDRANT_API_KEY must both be set."
            exit 1
          fi
          set +e
          curl -fsS --max-time 30 -o /dev/null \
            -H "api-key: $QDRANT_API_KEY" \
            "${QDRANT_URL%/}/collections/researchmind_v2" > /dev/null 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "::error::Qdrant request failed (curl exit $status). Check whether the cluster is suspended."
            exit 1
          fi
          echo "Qdrant request OK."
